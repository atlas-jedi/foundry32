# JAFIZ ("já fiz?") — a Foundry32 tool. One engine crate, two thin front-ends
# built from it: `jafiz.exe` (console, goes on PATH — the CLI Claude runs) and
# `jafiz-gui.exe` (GUI, launched by the hub). The two-binary split is a Windows
# subsystem necessity, not a preference — see src/lib.rs.
[package]
name = "jafiz"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Já fiz? — run manual test scenarios step by step, record what passed and what failed, and hand the result back to Claude."

[dependencies]
foundry-common = { path = "../foundry-common" }
serde_json = "1"
winapi = { version = "0.3.9", features = [
    "winbase", "minwinbase", "sysinfoapi", "wincon", "winuser", "commctrl",
    "libloaderapi", "processenv",
] }
native-windows-gui = { version = "1.0.13", features = [
    "list-view", "notice", "status-bar", "message-window", "menu", "combobox",
    "textbox", "file-dialog", "clipboard", "embed-resource", "high-dpi",
    "cursor", "tooltip",
] }

[build-dependencies]
embed-resource = "2"
